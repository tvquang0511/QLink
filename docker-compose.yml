services:
  postgres:
    image: postgres:16-alpine
    container_name: qlink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qlink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qlink_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-qlink_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qlink} -d ${POSTGRES_DB:-qlink_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qlink-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-qlink_db};Username=${POSTGRES_USER:-qlink};Password=${POSTGRES_PASSWORD:-qlink_dev_pass};
    ports:
      - "5102:5102"
    healthcheck:
      test: ["CMD-SHELL", "dotnet --version || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5102
    container_name: qlink-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
